<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mico{% endblock %}</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg-main: #0a0a0a;
            --bg-card: rgba(20,20,20,0.55);
            --border-soft: rgba(255,255,255,0.08);
            --text-main: #e6e6e6;
            --text-muted: #9b9b9b;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at top, #151515, #0a0a0a 70%);
            color: var(--text-main);
            font-family: "Poppins", sans-serif;
        }

        /* ---------- NAVBAR ---------- */
        .navbar-glass {
            background: rgba(12,12,12,0.65);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-soft);
        }

        .navbar-brand {
            letter-spacing: 1px;
        }

        .navbar-nav a {
            transition: 0.25s ease;
        }

        .navbar-nav i {
            font-size: 28px;
            color: var(--text-main);
            opacity: 0.85;
        }

        .navbar-nav a:hover i {
            opacity: 1;
            text-shadow: 0 0 10px rgba(255,255,255,0.35);
        }

        /* ---------- BUTTON ---------- */
        .btn-accent {
            background: linear-gradient(145deg, #1a1a1a, #0c0c0c);
            border: 1px solid #2a2a2a;
            color: #fff;
            padding: 0.5rem 1.2rem;
            border-radius: 10px;
            transition: 0.25s ease;
        }

        .btn-accent:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 14px rgba(255,255,255,0.18);
        }

        /* ---------- CONTENT ---------- */
        main {
            flex: 1;
            padding-top: 110px;
            padding-bottom: 60px;
        }

        /* ---------- GLASS CARD ---------- */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
        }

        /* ---------- FOOTER ---------- */
        footer {
            background: rgba(8,8,8,0.75);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-soft);
            padding: 2rem 0;
            text-align: center;
        }

        footer p {
            margin-bottom: 0.4rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer a {
            color: #bdbdbd;
            text-decoration: none;
            margin: 0 6px;
            transition: 0.25s;
        }

        footer a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
        }
    </style>

    {% block styles %}{% endblock %}
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-glass fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-white" href="{% url 'home' %}">Mico</a>

        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav ms-auto align-items-center gap-2">

                <a href="{% url 'users:members_list' %}">
                    <i class="bi bi-people"></i>
                </a>

                {% if request.user.is_authenticated %}

                    <a href="{% url 'users:profile_edit' %}">
                        <i class="bi bi-gear"></i>
                    </a>

                    <a href="{% url 'users:profile' user.username %}">
                        <i class="bi bi-person-circle"></i>
                    </a>

                    <a href="{% url 'posts:feed' %}">
                        <i class="bi bi-image"></i>
                    </a>

                {% else %}

                    <li class="nav-item">
                        <a class="btn-accent" href="{% url 'users:login' %}">Login</a>
                    </li>

                    <li class="nav-item">
                        <a class="btn-accent" href="{% url 'users:register' %}">Create Account</a>
                    </li>

                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<main class="container">
    {% block content %}
    {% endblock %}
</main>

<footer>
    <p>&copy; 2025 Mico Social Network</p>
    <div>
        <a href="https://github.com/Mierial" target="_blank">GitHub</a> ·
        <a href="https://www.youtube.com/@VanesPortnoi62" target="_blank">YouTube</a>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
