<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mico{% endblock %}</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <script src="https://kit.fontawesome.com/d1097af373.js" crossorigin="anonymous"></script>

    <style>
        body {
            background: #0d0d0d;
            color: #e6e6e6;
            font-family: "Poppins", sans-serif;
            line-height: 1.6;
        }

        /* ---- NAVBAR (глянцевий, темний, прозорий) ---- */
        .navbar-glass {
            background: rgba(15, 15, 15, 0.55);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-link {
            color: #e6e6e6 !important;
            transition: 0.3s;
            font-weight: 500;
        }

        .nav-link:hover {
            color: #ffffff !important;
            text-shadow: 0 0 6px #ffffff77;
        }

        /* Space between navbar buttons */
        .navbar-nav {
            gap: 0.6rem;
            align-items: center;
        }

        /* Акцентні кнопки */
        .btn-accent {
            background: linear-gradient(145deg, #1a1a1a, #0b0b0b);
            border: 1px solid #333;
            color: #fff;
            padding: 0.5rem 1.1rem;
            border-radius: 8px;
            transition: 0.25s ease-in-out;
        }

        .btn-accent:hover {
            background: linear-gradient(145deg, #222, #111);
            box-shadow: 0 0 12px #ffffff22;
            transform: translateY(-2px);
        }

        .section {
            padding: 4rem 0;
        }

        .glass-card {
            background: rgba(20, 20, 20, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 15px;
            backdrop-filter: blur(14px);
            padding: 2rem;
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
        }

        footer {
            margin-top: auto;
            padding: 2rem 0;
            background: rgba(10,10,10,0.65);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        footer a {
            color: #bbb;
            transition: 0.3s;
            text-decoration: none;
        }

        footer a:hover {
            color: #fff;
            text-shadow: 0 0 8px #fff5;
        }
    </style>

    {% block styles %}{% endblock %}
</head>

<body>


<nav class="navbar navbar-expand-lg navbar-glass fixed-top">
    <div class="container">
        <a class="navbar-brand text-white fw-bold" href="{% url 'home' %}">Mico</a>

        <button class="navbar-toggler bg-dark" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">

                <a href="{% url 'users:members_list' %}">
                    <i class="fa-solid fa-people-group" style="color: white; font-size: 32px; margin: 5px;"></i>
                </a>
            {% if request.user.is_authenticated %}
            <a href="{% url 'users:profile_edit' %}">
                <i class="bi bi-gear" style="color: white; font-size: 32px; margin: 5px;"></i>
            </a>
            
            <a href="{% url 'users:profile' %}">
                <i class="bi bi-person-circle" style="color: white; font-size: 32px;"></i>
            </a>

            {% else %} 
                <li class="nav-item">
                    <a class="btn-accent" href="{% url 'users:login' %}">Login</a>
                </li>

                <li class="nav-item">
                    <a class="btn-accent" href="{% url 'users:register' %}">Create Account</a>
                </li>
            {% endif %}
            </ul>
        </div>
    </div>
</nav>


<div style="padding-top: 100px;">
    {% block content %}
    {% endblock %}
</div>


<footer class="text-center text-secondary">
    <p class="mb-1">&copy; 2025 Mico Social Network</p>
    <div>
        <a href="https://github.com/Mierial">GitHub</a> ·
        <a href="https://www.youtube.com/@VanesPortnoi62">YouTube</a>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
