{% extends 'base.html' %}

{% block title %} Post comments {% endblock %}

{% block content %}
<div class='container'>
    {% for comment in comments %}
        <img src="{{ comment.author.avatar.url }}" class="rounded-circle" alt="{{ comment.author.username }}">
        <div>
            <p>{{ comment.content }}</p>
        </div>
        {% endfor %}
        <form method = 'POST' action="{% url 'posts:comments_view' post.id %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">send</button>
        </form>
</div>
{% endblock %}
