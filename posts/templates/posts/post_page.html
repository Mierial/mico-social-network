{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<style>
    body {
        background: #0f0f13;
    }

    .post-container {
        max-width: 900px;
        margin: 60px auto;
        padding: 32px;
        background: #16161d;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        font-family: 'Poppins', sans-serif;
    }

    .post-image {
        width: 100%;
        height: 420px;
        object-fit: cover;
        border-radius: 16px;
        margin-bottom: 24px;
    }

    .post-title {
        font-size: 36px;
        font-weight: 600;
        margin-bottom: 16px;
        color: #f5f5f7;
    }

    .post-description {
        font-size: 18px;
        line-height: 1.7;
        color: #c7c7d1;
        margin-bottom: 32px;
    }

    .post-actions {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .back-btn {
        text-decoration: none;
        color: #c7c7d1;
        background: #22222c;
        padding: 10px 20px;
        border-radius: 14px;
        transition: background 0.2s ease, transform 0.2s ease;
    }

    .back-btn:hover {
        background: #2c2c38;
        transform: translateY(-2px);
    }
</style>

<div class="post-container">

    <img src="{{ post.image.url }}" alt="Post image" class="post-image">

    <h1 class="post-title">{{ post.title }}</h1>

    <p class="post-description">
        {{ post.description }}
    </p>

    <div class="post-actions">

        <form method="POST" action="{% url 'posts:like_post' post.id %}">
            {% csrf_token %}
            {% if is_liked %}
            <button type="submit" class="btn btn-danger">Unlike</button>
            {% else %}
            <button type="submit" class="btn">❤️</button>
            {% endif %}
        </form>

        <a href="{% url 'users:profile' post.author %}" class="back-btn">
            ← Back
        </a>

    </div>

</div>
{% endblock %}
