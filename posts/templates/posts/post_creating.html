{% extends 'base.html' %}

{% block title %} Post Creating {% endblock %}

{% block content %}
<div class="container col-md-6 glass-card p-4 mx-auto">
  <h1 class="text-light">Create New Post</h1>
  <form method="POST", enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-accent w-100 mt-3">Create post</button>
  </form>
</div>
{% endblock %}
