{% extends "base.html" %}

{% block title %}Mico — Login{% endblock %}

{% block content %} 

<h1 class="text-center mb-4">Login to your account</h1>

<div class="container col-md-6 glass-card p-4 mx-auto">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-accent w-100 mt-3">Login</button>
  </form>
</div>
{% endblock %}
