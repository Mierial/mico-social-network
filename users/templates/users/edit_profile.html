{% extends 'base.html' %}

{% block title %}Profile edit{% endblock %}

{% block content %}

<div>
    <h1 class="text-light fw-bold"> Profile edit </h1>  
    <div class="container col-md-6 glass-card p-4 mx-auto">
      <form method = "post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-accent w-100 mt-3">Save changes</button>
        </form>
</div>

{% endblock %}
