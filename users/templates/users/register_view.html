{% extends "base.html" %}

{% block title %}Mico — Register{% endblock %}

{% block content %} 

<h1 class="text-center mb-4">Create Your Account</h1>

<div class="container col-md-6 glass-card p-4 mx-auto">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-accent w-100 mt-3">Register</button>
  </form>
</div>
{% endblock %}
